# ── catch-alls: titles that omit the year (roman-numeral spines, abbreviated
#    listings). titleMust = union of every target volume in roman numerals,
#    the vol/no forms, and the landmark-paper tells. \b guards keep XXVII from
#    matching inside XXVIII.
- id: bstj-roman-undated
  label: "BSTJ — roman-numeral / undated titles (all target volumes)"
  vertical: science
  match: { q: "bell system technical journal", categoryHint: "books-magazines" }
  titleMust: "\\b(iii|vii|xix|xxvii|xxviii|xxix|xlii|xliii|xlix|lvii|lviii)\\b|shannon|nyquist|hartley|\\bbode\\b|shockley|hamming|telstar|\\bunix\\b|charge.?coupled|secrecy|mobile phone|\\bess\\b"
  titleNot: "reprint|facsimile|photocopy|photostat|xerox|pdf|cd-?rom|dvd|digitized|print.?on.?demand"
  added: 2026-08-21

- id: bstj-abbrev
  label: "BSTJ — abbreviated titles (all target volumes)"
  vertical: science
  match: { q: "bstj", categoryHint: "books-magazines" }
  titleMust: "^(?=.*\\bbstj\\b)(?=.*(\\b(iii|vii|xix|xxvii|xxviii|xxix|xlii|xliii|xlix|lvii|lviii)\\b|\\bvol|shannon|nyquist|hartley|shockley|hamming|telstar|unix|journal|technical))"
  titleNot: "reprint|facsimile|photocopy|photostat|xerox|pdf|cd-?rom|dvd|digitized|print.?on.?demand"
  added: 2026-08-21
