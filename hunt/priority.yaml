# Starling hunt list — curated priority targets (§4.4 of PROPOSAL.md)
#
# CLEARED 2026-08-21 (Collin): the seeded targets (Eagles cards, Schulz, game-
# used football, vintage Apple, Sendak, fossils…) were way too broad — wide
# lenses are the sweep/goldmine lanes' job now. This list is reserved for
# HYPER-SPECIFIC wants; the 10% reserved call budget sits idle until entries
# return, and the lane reactivates the moment one is added (next cron tick).
#
# Rules of the lane:
#   · polled EVERY cron run, paid from the reserved 10% call budget
#   · the book still prices — hunting never inflates a value; targets with no
#     book row surface as "hunted — no book value" (facts only, no depth %)
#   · minDepth may loosen the 0.25 board bar per entry; the scam cap never moves
#
# Match forms (one per entry):
#   match: { key: "player-slug|1986|fleer|57|PSA 9" }     exact book identity
#   match: { keyPrefix: "michael-jordan|1986|fleer" }     key family (med-desc)
#   match: { q: "raw search terms", categoryHint: "sports-cards" }
# Optional per entry: titleMust / titleNot (regex, case-insensitive),
#                     minDepth (loosen 0.25), label, note, added.
#
# Template:
# - id: kebab-case-id
#   label: "Human label"
#   vertical: sports-cards | pokemon | autographs | art-editions | watches | sports | science
#   match: { q: "…", categoryHint: "…" }
#   titleMust: "…"
#   titleNot: "…"
#   added: 2026-08-21
