# Starling hunt list — curated priority targets (§4.4 of PROPOSAL.md)
#
# BSTJ GRAIL HUNT (Collin, 2026-08-21): original printings of the Bell System
# Technical Journal issues that carry the landmark papers — Shannon's
# information theory, Shockley's junctions, Hamming codes, UNIX, the CCD,
# Telstar, AMPS, Nyquist, Hartley, Bode — as single issues OR bound annual
# volumes. ORIGINALS ONLY (titleNot kills reprints/facsimiles/print-on-demand).
#
# STRUCTURE (why one entry per volume-year, not one per phrasing): the
# relevance guard requires EVERY query token in the listing title, so the
# query is the minimal common denominator — the full journal name + year.
# BSTJ's volume number maps 1:1 to its year (vol 1 = 1922), so a year IS the
# volume. Roman-numeral and "BSTJ"-abbreviated titles that omit the year are
# caught by the two catch-all entries at the bottom, whose titleMust unions
# every target volume in roman numerals plus the landmark-paper names.
#
# Rules of the lane: polled EVERY cron run off the reserved 10% budget; the
# book still prices (these will surface as "hunted — no book value" facts-only
# cards — the corpus has no BSTJ rows); scam cap never moves.

- id: bstj-1924-v3
  label: "BSTJ Vol 3 (1924) — Nyquist, Certain Factors Affecting Telegraph Speed (No 2, Apr)"
  vertical: science
  titleMust: "bell ?system|bstj"
  match: { q: "bell system technical journal 1924", categoryHint: "books-magazines" }
  titleNot: "reprint|facsimile|photocopy|photostat|xerox|pdf|cd-?rom|dvd|digitized|print.?on.?demand"
  added: 2026-08-21

