name: Deploy to Cloudflare Pages

# The site is a pure static export (output:'export') hosted on Cloudflare Pages
# as project "starling" — no git integration, this workflow IS the deploy
# pipeline. The board data is baked into the export (public/data/starling/*.json,
# committed by board.yml), so both code changes and the 3-hourly board-data
# commit must redeploy to go live. Path-filtered so unrelated commits (docs,
# scripts, fixtures) don't spend a deploy.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - 'functions/**'
      - 'scripts/hunt-engine/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Shared deploy lane — never two wranglers racing Pages production. Queue, don't
# cancel: a board-data deploy must not kill an in-flight code deploy or vice
# versa; pushes are rare enough that the wait is minutes.
concurrency:
  group: deploy-starling
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The board JSON is already in the checkout (committed by board.yml) — no
      # R2 pull needed here; next just exports it to out/.
      # Production never ships fixture hunt data: the hunt engine refuses fixture
      # mode in CI, and this guard refuses to deploy a fixture payload that was
      # committed by hand.
      - name: Refuse fixture hunt data
        run: |
          f=public/data/starling/hunt/dashboard.json
          if [ -f "$f" ] && node -e "process.exit(JSON.parse(require('fs').readFileSync('$f','utf8')).run.mode==='fixture'?0:1)"; then
            echo "::error::public/data/starling/hunt/dashboard.json is FIXTURE data — refusing to deploy"; exit 1
          fi

      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test

      - name: Build static export
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STARLING_PIN: ${{ secrets.STARLING_PIN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set — create a token at dash.cloudflare.com/profile/api-tokens (Custom: Account → Cloudflare Pages → Edit) and add it with: gh secret set CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          # Self-provision the Pages project on first deploy (no-op if it already
          # exists). Surface the real create error rather than swallowing it.
          set +e
          CREATE_OUT=$(npx wrangler@4.120.1 pages project create starling --production-branch main 2>&1)
          CREATE_RC=$?
          echo "$CREATE_OUT"
          if [ $CREATE_RC -ne 0 ] && ! echo "$CREATE_OUT" | grep -qi "already"; then
            echo "::warning::pages project create exited $CREATE_RC (see output above)"
          fi
          set -e
          # The site is PIN-gated (functions/_middleware.ts). The PIN is a GitHub
          # secret, pushed to the Pages project as a secret before every deploy —
          # it never appears in this public repo. Missing secret = refuse to deploy
          # (the gate fails closed, so a deploy without it would lock the site).
          if [ -z "$STARLING_PIN" ]; then
            echo "::error::STARLING_PIN secret is not set — refusing to deploy a site whose gate would lock everyone out"; exit 1
          fi
          printf '%s' "$STARLING_PIN" | npx wrangler@4.120.1 pages secret put STARLING_PIN --project-name starling
          npx wrangler@4.120.1 pages deploy out --project-name starling --branch main --commit-dirty=true
