name: Board (deal pipeline)

# The 3-hourly deal-board pipeline. One job: pull persistent state from R2 →
# run the board pipeline (sync book → poll eBay → identify → gate → score →
# publish → receipts) → push state back to R2 → commit the regenerated
# public/data/starling/*.json to main. That commit lands under paths deploy.yml
# watches, so the fresh board redeploys to Cloudflare Pages automatically — the
# data is baked into the static export, so a data commit must redeploy to go
# live.
#
# Fixture gate: until the eBay production keyset exists, EBAY_CLIENT_ID is an
# empty secret. The run step detects that and executes the pipeline in FIXTURE
# mode (npm run board:fixture) instead of live — so the whole system (identify →
# gate → score → publish → receipts → the committed board.json) still exercises
# end-to-end against recorded fixtures every cron tick. The day the keyset is
# added, the same workflow flips to live with no edit.

on:
  schedule:
    # 15 */3 * * * — every 3 hours at :15 past. Off the hour so it never contends
    # with other :00 crons; the 3h cadence keeps live prices current (COMPACT
    # re-checks) and satisfies the ALA's delete-when-gone obligation comfortably.
    - cron: '15 */3 * * *'
  workflow_dispatch:

# contents: write — the job commits the regenerated board JSON back to main.
# (lectr learned this the hard way via 403s — commit 43e4005.)
permissions:
  contents: write
  actions: write   # to dispatch deploy.yml after committing a fresh board

# Never two board runs racing the same R2 state / the same push to main. Queue,
# don't cancel: a mid-flight run must finish its state push before the next.
concurrency:
  group: board
  cancel-in-progress: false

env:
  STARLING_MODE: live
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # State lives in R2 (bucket starling-data), not git — pull the seen-ledger,
      # receipts, quota ledger, scheduler wheel and cert cache so this tick picks
      # up exactly where the last left off. Bootstraps empty on the first run.
      - name: Pull R2 state
        run: bash scripts/lib/data-store.sh pull

      # Live if the eBay keyset exists; fixtures otherwise. The gate reads the
      # secret via env (secrets aren't available to step-level `if:`), so an
      # empty EBAY_CLIENT_ID transparently routes to board:fixture.
      - name: Run board pipeline
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EPN_CAMPAIGN_ID: ${{ secrets.EPN_CAMPAIGN_ID }}
          PSA_API_TOKEN: ${{ secrets.PSA_API_TOKEN }}
          # Read-only token scoped to lectr's PRIVATE value-book object. The book
          # is never published publicly; live mode fetches it from R2 in-build.
          LECTR_R2_TOKEN: ${{ secrets.LECTR_R2_TOKEN }}
        run: |
          # No eBay keys → full fixture harness. eBay keys present → LIVE: real
          # eBay listings, scored against lectr's real book if it's readable from
          # private R2 (via LECTR_R2_TOKEN or the CLOUDFLARE token), else the run
          # falls back to the sample book automatically (sync-book.ts). So this
          # auto-upgrades to real valuations with zero config change.
          if [ -z "$EBAY_CLIENT_ID" ]; then
            echo "No eBay keyset — running FIXTURE mode end-to-end."
            npm run board:fixture
          else
            echo "eBay keyset present — LIVE (real book if readable, else sample)."
            STARLING_MODE=live npm run board
          fi

      # Ensure the state bucket exists (self-heals a first run before the bucket
      # was created). Non-fatal: if it already exists or can't be created, the
      # push step below just degrades gracefully.
      - name: Ensure R2 bucket
        run: npx --yes wrangler@4.120.1 r2 bucket create starling-data 2>/dev/null || echo "bucket exists or unavailable — continuing"
        continue-on-error: true

      # Persist the updated state back to R2 (write-once version + pointer +
      # dated snapshot), then trim the versions/ ladder. BEST-EFFORT: state
      # (seen-ledger, receipts, quota) is valuable but must never block the board
      # from publishing + deploying. A failed push just means this tick is
      # stateless; the next tick retries.
      - name: Push R2 state
        run: bash scripts/lib/data-store.sh push || echo "R2 state push failed (non-fatal) — board still publishes"
        continue-on-error: true
      - name: Prune old R2 versions (keep 14)
        run: bash scripts/lib/data-store.sh prune 14 || echo "prune failed (non-fatal, retries next tick)"
        continue-on-error: true

      # Commit the regenerated board JSON. This push to main is what triggers
      # deploy.yml (public/** is in its path filter) — the board redeploys with
      # fresh data. No-op cleanly when nothing changed (a tick that surfaced no
      # new/updated deals must not create empty commits).
      - name: Commit regenerated board
        id: commit
        run: |
          git config user.name  "starling-bot"
          git config user.email "starling-bot@users.noreply.github.com"
          git add public/data/starling
          if git diff --cached --quiet; then
            echo "board unchanged this tick — nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "board: refresh deals ($(date -u +%Y-%m-%dT%H:%MZ))"
            # a human push landing mid-tick makes the bot commit non-FF and the
            # whole run red (happened Aug 20 01:48Z) — rebase our one data
            # commit onto whatever arrived, then push
            git pull --rebase origin main || true
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A commit made with GITHUB_TOKEN does NOT trigger deploy.yml (GitHub's
      # recursion guard), so dispatch it explicitly when the board changed.
      - name: Deploy the fresh board
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml
